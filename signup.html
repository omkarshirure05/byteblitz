<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteBlitz - SignUp</title>
  <link rel="stylesheet" href="./signup.css">
</head>
<body>

<div class="container">
    <a href="./login.html" class="secondary-button">Back<i class="fa-solid fa-right-long"></i></a>
</div>

  <div class="login-container">
    
    <h1 class="logo">ByteBlitz</h1>
    <h2 class="login-title">Signup</h2>
    <form class="login-form">
      <div class="input-box">
        <input type="text" required>
        <label>Username</label>
      </div>
      <div class="input-box">
        <input type="password" required>
        <label>Password</label>
      </div>
      <button type="submit" class="login-btn">SignUp</button>
      <p class="signup-text">Already have an account?<a href="./login.html">LogIn</a></p>
    </form>
  </div>



  
</body>
</html>
