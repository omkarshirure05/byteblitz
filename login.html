<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteBlitz - Login</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>

 <div class="container">
    <a href="./index.html" class="secondary-button">Back<i class="fa-solid fa-right-long"></i></a>
</div>


  <div class="login-container">
    
    <h1 class="logo">ByteBlitz</h1>
    <h2 class="login-title">Login</h2>
    <form class="login-form">
      <div class="input-box">
        <input type="text" required>
        <label>Username</label>
      </div>
      <div class="input-box">
        <input type="password" required>
        <label>Password</label>
      </div>
      <button type="submit" class="login-btn">Login</button>
      <p class="signup-text">Don’t have an account? <a href="./signup.html">Sign Up</a></p>
    </form>
  </div>
  

  
</body>
</html>
